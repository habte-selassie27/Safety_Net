[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "safetynet-test"
version = "0.1.0"
description = "pytest fixtures for SafetyNet intelligent contracts"
requires-python = ">=3.11"
dependencies = ["pytest>=8", "safetynet-sim"]

[project.entry-points.pytest11]
safetynet = "safetynet_test.plugin"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
safetynet_test = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "../safetynet-sim"]
addopts = ["-p", "safetynet_test.plugin"]
