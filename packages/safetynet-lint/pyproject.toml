[project]
name = "safetynet-lint"
version = "0.2.0"
description = "SafetyNet domain linter (SI rules) for GenLayer Intelligent Contracts"
requires-python = ">=3.11"

[project.scripts]
safetynet-lint = "safetynet_lint.cli:main"
safetynet-report = "safetynet_lint.report:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["tests/corpus"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]
