<!doctype html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SafetyNet — The public record of AI harm</title>
    <meta
      name="description"
      content="Report an AI safety incident with evidence. The AI provider answers. GenLayer validators decide whether the system violated its own published safety policy. Every verdict is permanent, queryable, and free to check."
    />
    <meta property="og:title" content="SafetyNet — The public record of AI harm" />
    <meta
      property="og:description"
      content="Report an AI safety incident with evidence. The AI provider answers. GenLayer validators decide whether the system violated its own published safety policy."
    />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/og-default.png" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0d1117" media="(prefers-color-scheme: dark)" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("snet-theme");
          var prefersDark =
            window.matchMedia &&
            window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = stored === "light" || stored === "dark"
            ? stored
            : prefersDark
              ? "dark"
              : "light";
          document.documentElement.setAttribute("data-theme", theme);
          document.documentElement.style.colorScheme = theme;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
